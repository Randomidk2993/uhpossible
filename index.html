<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Viewtube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <button class="logo" onclick="navHome()" aria-label="Home">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <rect width="26" height="26" rx="6" fill="#FF3B30"/>
        <polygon points="10,7 21,13 10,19" fill="white"/>
      </svg>
      <span class="logo-text">Viewtube</span>
    </button>

    <form class="search-form" onsubmit="handleSearch(event)" role="search">
      <input id="q" class="search-input" type="search"
        placeholder="Search…" autocomplete="off" spellcheck="false"
        aria-label="Search videos" />
      <button class="search-btn" type="submit" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </form>

    <div class="header-right">
      <label class="hdr-label" for="instance-sel">Instance</label>
      <select id="instance-sel" class="sel" aria-label="Piped API instance" onchange="onInstanceChange()">
        <option value="https://pipedapi.kavin.rocks">kavin.rocks (official)</option>
        <option value="https://pipedapi-libre.kavin.rocks">kavin.rocks libre</option>
        <option value="https://pipedapi.adminforge.de">adminforge.de 🇩🇪</option>
        <option value="https://piped-api.privacy.com.de">privacy.com.de 🇩🇪</option>
        <option value="https://pipedapi.r4fo.com">r4fo.com 🇩🇪</option>
        <option value="https://api.piped.yt">piped.yt 🇩🇪</option>
        <option value="https://pipedapi.drgns.space">drgns.space 🇺🇸</option>
        <option value="https://pipedapi.darkness.services">darkness.services 🇺🇸</option>
        <option value="https://api.piped.private.coffee">private.coffee 🇦🇹</option>
        <option value="https://pipedapi.ducks.party">ducks.party 🇳🇱</option>
      </select>
      <span id="instance-status" class="instance-status" title="Instance health"></span>
    </div>
  </header>

  <div id="toast" class="toast hidden" role="alert" aria-live="polite"></div>

  <main id="app">

    <!-- Home / Trending -->
    <section id="view-home" class="view active" aria-label="Trending">
      <div class="section-head">
        <h2 class="sec-title">Trending</h2>
        <select id="region-sel" class="sel sm" onchange="loadTrending()" aria-label="Region">
          <option value="US">🇺🇸 US</option>
          <option value="GB">🇬🇧 UK</option>
          <option value="CA">🇨🇦 CA</option>
          <option value="AU">🇦🇺 AU</option>
          <option value="DE">🇩🇪 DE</option>
          <option value="FR">🇫🇷 FR</option>
          <option value="JP">🇯🇵 JP</option>
          <option value="IN">🇮🇳 IN</option>
          <option value="BR">🇧🇷 BR</option>
        </select>
      </div>
      <div id="home-grid" class="video-grid"></div>
      <div id="home-state" class="state-box">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading trending…</p>
      </div>
    </section>

    <!-- Search results -->
    <section id="view-search" class="view" aria-label="Search results">
      <div class="section-head">
        <h2 id="search-heading" class="sec-title"></h2>
        <div class="filter-row">
          <select id="sort-sel" class="sel sm" onchange="rerunSearch()" aria-label="Sort by">
            <option value="relevance">Relevance</option>
            <option value="rating">Rating</option>
            <option value="upload_date">Newest</option>
            <option value="view_count">Most viewed</option>
          </select>
          <select id="type-sel" class="sel sm" onchange="rerunSearch()" aria-label="Content type">
            <option value="videos">Videos</option>
            <option value="channels">Channels</option>
            <option value="playlists">Playlists</option>
            <option value="all">All</option>
          </select>
        </div>
      </div>
      <div id="search-grid" class="video-grid"></div>
      <div id="search-state" class="state-box hidden"></div>
      <nav id="pagination" class="pagination hidden" aria-label="Search pages">
        <button id="btn-prev" class="page-btn" onclick="changePage(-1)" disabled>← Prev</button>
        <span id="page-lbl" class="page-lbl">Page 1</span>
        <button id="btn-next" class="page-btn" onclick="changePage(1)">Next →</button>
      </nav>
    </section>

    <!-- Watch -->
    <section id="view-watch" class="view" aria-label="Video player">
      <div class="watch-layout">
        <div class="watch-main">
          <div id="player-wrap" class="player-wrap">
            <div class="spinner large" id="player-spin" aria-label="Loading video"></div>
          </div>
          <div id="video-meta" class="video-meta hidden">
            <h1 id="v-title" class="v-title"></h1>
            <div class="v-stats">
              <span id="v-views"></span>
              <span id="v-date"></span>
              <span id="v-likes" class="likes-pill hidden"></span>
            </div>
            <a id="ch-link" class="ch-link" href="#" onclick="return false;">
              <div id="ch-avatar" class="ch-avatar" aria-hidden="true"></div>
              <div>
                <p id="ch-name" class="ch-name"></p>
                <p id="ch-subs" class="ch-subs"></p>
              </div>
            </a>
            <details class="desc-wrap">
              <summary class="desc-toggle">Description</summary>
              <div id="v-desc" class="v-desc"></div>
            </details>
            <a id="yt-link" href="#" target="_blank" rel="noopener noreferrer" class="yt-link">
              Watch on YouTube ↗
            </a>
          </div>
        </div>
        <aside class="watch-aside" aria-label="Related videos">
          <p class="aside-title">Up next</p>
          <div id="related" class="related-list"></div>
          <div id="related-state" class="state-box small hidden">
            <div class="spinner small" aria-hidden="true"></div>
          </div>
        </aside>
      </div>
    </section>

  </main>

  <footer class="footer">
    Videos play via YouTube's official embed player.
    Metadata via public <a href="https://piped.video" target="_blank" rel="noopener">Piped</a> instances.
    All content © respective owners. Not affiliated with YouTube or Google.
  </footer>

  <script src="app.js"></script>
</body>
</html>
