<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Viewtube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <button class="logo" onclick="navHome()" aria-label="Home">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <rect width="26" height="26" rx="6" fill="#FF3B30"/>
        <polygon points="10,7 21,13 10,19" fill="white"/>
      </svg>
      <span class="logo-text">Viewtube</span>
    </button>

    <nav class="main-nav">
      <button class="nav-btn active" id="nav-home" onclick="navHome()">Home</button>
      <button class="nav-btn" id="nav-shorts" onclick="navShorts()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex-shrink:0"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.23-2.53-5.06-1.56L6 6.94c-1.29.68-2.07 2.01-2 3.44.07 1.43.97 2.67 2.31 3.22l1.2.5L6 14.94c-1.84.96-2.53 3.23-1.56 5.06.97 1.83 3.23 2.53 5.06 1.56l8.5-4.5c1.29-.68 2.07-2.01 2-3.44-.07-1.43-.97-2.67-2.23-3.3zM10 14.45v-5l5 2.5-5 2.5z"/></svg>
        Shorts
      </button>
    </nav>

    <form class="search-form" onsubmit="handleSearch(event)" role="search">
      <input id="q" class="search-input" type="search"
        placeholder="Search videos…" autocomplete="off" spellcheck="false"
        aria-label="Search videos" />
      <button class="search-btn" type="submit" aria-label="Search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </form>

    <div class="header-right">
      <!-- Custom animated instance dropdown -->
      <div id="instance-dropdown-wrapper" class="dd-wrapper" aria-label="Piped API instance">
        <button class="dd-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="dd-trigger-flag">🇦🇹</span>
          <span class="dd-trigger-label">private.coffee</span>
          <svg class="dd-caret" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true">
            <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="dd-list" role="listbox"></div>
      </div>

      <!-- Instance status badge -->
      <div id="instance-status" class="instance-status-badge status-checking" title="Checking instance…">
        <span class="status-dot"></span>
        <span class="status-label">Connecting…</span>
      </div>
    </div>
  </header>

  <div id="toast" class="toast hidden" role="alert" aria-live="polite"></div>

  <main id="app">

    <!-- Home / Trending -->
    <section id="view-home" class="view active" aria-label="Trending">
      <div class="section-head">
        <h2 class="sec-title">Trending</h2>
        <select id="region-sel" class="sel sm" onchange="loadTrending()" aria-label="Region">
          <option value="US">🇺🇸 US</option>
          <option value="GB">🇬🇧 UK</option>
          <option value="CA">🇨🇦 CA</option>
          <option value="AU">🇦🇺 AU</option>
          <option value="DE">🇩🇪 DE</option>
          <option value="FR">🇫🇷 FR</option>
          <option value="JP">🇯🇵 JP</option>
          <option value="IN">🇮🇳 IN</option>
          <option value="BR">🇧🇷 BR</option>
        </select>
      </div>
      <div id="home-grid" class="video-grid"></div>
      <div id="home-state" class="state-box">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading trending…</p>
      </div>
    </section>

    <!-- Search results -->
    <section id="view-search" class="view" aria-label="Search results">
      <div class="section-head">
        <h2 id="search-heading" class="sec-title"></h2>
        <div class="filter-row">
          <select id="sort-sel" class="sel sm" onchange="rerunSearch()" aria-label="Sort by">
            <option value="relevance">Relevance</option>
            <option value="rating">Rating</option>
            <option value="upload_date">Newest</option>
            <option value="view_count">Most viewed</option>
          </select>
          <select id="type-sel" class="sel sm" onchange="rerunSearch()" aria-label="Content type">
            <option value="videos">Videos</option>
            <option value="channels">Channels</option>
            <option value="playlists">Playlists</option>
            <option value="all">All</option>
          </select>
        </div>
      </div>
      <div id="search-grid" class="video-grid"></div>
      <div id="search-state" class="state-box hidden"></div>
      <nav id="pagination" class="pagination hidden" aria-label="Search pages">
        <button id="btn-prev" class="page-btn" onclick="changePage(-1)" disabled>← Prev</button>
        <span id="page-lbl" class="page-lbl">Page 1</span>
        <button id="btn-next" class="page-btn" onclick="changePage(1)">Next →</button>
      </nav>
    </section>

    <!-- Watch -->
    <section id="view-watch" class="view" aria-label="Video player">
      <div class="watch-layout">
        <div class="watch-main">
          <div id="player-wrap" class="player-wrap">
            <div class="spinner large" id="player-spin" aria-label="Loading video"></div>
          </div>
          <div id="video-meta" class="video-meta hidden">
            <h1 id="v-title" class="v-title"></h1>
            <div class="v-stats">
              <span id="v-views" class="stat-chip"></span>
              <span id="v-date" class="stat-chip"></span>
              <span id="v-likes" class="likes-pill hidden"></span>
            </div>
            <a id="ch-link" class="ch-link" href="#" onclick="return false;">
              <div id="ch-avatar" class="ch-avatar" aria-hidden="true"></div>
              <div class="ch-text">
                <p id="ch-name" class="ch-name"></p>
                <p id="ch-subs" class="ch-subs"></p>
              </div>
            </a>
            <details class="desc-wrap">
              <summary class="desc-toggle">Description</summary>
              <div id="v-desc" class="v-desc"></div>
            </details>
            <a id="yt-link" href="#" target="_blank" rel="noopener noreferrer" class="yt-link">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex-shrink:0"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
              Watch on YouTube
            </a>
          </div>
        </div>
        <aside class="watch-aside" aria-label="Related videos">
          <p class="aside-title">Up next</p>
          <div id="related" class="related-list"></div>
          <div id="related-state" class="state-box small hidden">
            <div class="spinner small" aria-hidden="true"></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- Shorts -->
    <section id="view-shorts" class="view" aria-label="Shorts">
      <div class="shorts-shell">
        <!-- Left: video column -->
        <div class="shorts-col" id="shorts-col">
          <div id="shorts-state" class="state-box hidden"></div>
          <div id="shorts-feed" class="shorts-feed"></div>
        </div>

        <!-- Right: action sidebar (populated by JS) -->
        <div class="shorts-sidebar" id="shorts-sidebar">
          <div class="shorts-actions-placeholder"></div>
        </div>
      </div>

      <!-- Nav arrows -->
      <button class="shorts-nav-btn shorts-nav-up" id="shorts-up" onclick="shortsNav(-1)" aria-label="Previous short">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
      <button class="shorts-nav-btn shorts-nav-down" id="shorts-down" onclick="shortsNav(1)" aria-label="Next short">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </section>

  </main>

  <footer class="footer">
    Videos play via YouTube's official embed player.
    Metadata via public <a href="https://piped.video" target="_blank" rel="noopener">Piped</a> instances.
    All content © respective owners. Not affiliated with YouTube or Google.
  </footer>

  <script src="app.js"></script>
</body>
</html>
