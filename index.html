<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewtube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <a href="/" class="logo" onclick="showHome(); return false;">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="6" fill="#FF3B30"/>
        <polygon points="11,8 22,14 11,20" fill="white"/>
      </svg>
      <span>Viewtube</span>
    </a>

    <form class="search-form" onsubmit="handleSearch(event)">
      <input
        id="search-input"
        class="search-input"
        type="search"
        placeholder="Search videos…"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="search-btn" type="submit" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </form>

    <div class="instance-wrap">
      <label for="instance-select" class="instance-label">Instance</label>
      <select id="instance-select" class="instance-select" onchange="onInstanceChange()">
        <option value="https://yewtu.be">yewtu.be</option>
        <option value="https://inv.nadeko.net">inv.nadeko.net</option>
        <option value="https://invidious.nerdvpn.de">invidious.nerdvpn.de</option>
        <option value="https://iv.melmac.space">iv.melmac.space</option>
        <option value="https://invidious.privacyredirect.com">privacyredirect.com</option>
      </select>
    </div>
  </header>

  <!-- Main content area -->
  <main id="app">

    <!-- Home / trending view -->
    <section id="view-home" class="view active">
      <div class="section-header">
        <h2 class="section-title">Trending</h2>
        <select id="region-select" class="region-select" onchange="loadTrending()">
          <option value="US">United States</option>
          <option value="GB">United Kingdom</option>
          <option value="CA">Canada</option>
          <option value="AU">Australia</option>
          <option value="DE">Germany</option>
          <option value="FR">France</option>
          <option value="JP">Japan</option>
          <option value="IN">India</option>
          <option value="BR">Brazil</option>
        </select>
      </div>
      <div id="trending-grid" class="video-grid"></div>
      <div id="trending-loading" class="loading-state">
        <div class="spinner"></div>
        <p>Loading trending videos…</p>
      </div>
      <div id="trending-error" class="error-state hidden"></div>
    </section>

    <!-- Search results view -->
    <section id="view-search" class="view">
      <div class="section-header">
        <h2 id="search-heading" class="section-title"></h2>
        <div class="search-filters">
          <select id="sort-select" class="region-select" onchange="rerunSearch()">
            <option value="relevance">Relevance</option>
            <option value="rating">Rating</option>
            <option value="upload_date">Upload date</option>
            <option value="view_count">View count</option>
          </select>
          <select id="type-select" class="region-select" onchange="rerunSearch()">
            <option value="video">Videos</option>
            <option value="channel">Channels</option>
            <option value="playlist">Playlists</option>
            <option value="all">All</option>
          </select>
        </div>
      </div>
      <div id="search-grid" class="video-grid"></div>
      <div id="search-loading" class="loading-state hidden">
        <div class="spinner"></div>
        <p>Searching…</p>
      </div>
      <div id="search-error" class="error-state hidden"></div>
      <div id="search-pagination" class="pagination hidden">
        <button id="prev-page-btn" class="page-btn" onclick="changePage(-1)" disabled>← Prev</button>
        <span id="page-indicator" class="page-num">Page 1</span>
        <button id="next-page-btn" class="page-btn" onclick="changePage(1)">Next →</button>
      </div>
    </section>

    <!-- Watch view -->
    <section id="view-watch" class="view">
      <div class="watch-layout">
        <div class="watch-main">
          <div id="player-area" class="player-area">
            <div id="player-loading" class="player-loading">
              <div class="spinner large"></div>
            </div>
          </div>
          <div id="video-meta" class="video-meta hidden">
            <h1 id="video-title" class="video-title"></h1>
            <div class="video-stats">
              <span id="video-views"></span>
              <span id="video-date"></span>
              <span id="video-likes" class="likes-badge"></span>
            </div>
            <a id="channel-link" href="#" class="channel-link" onclick="return false;">
              <div id="channel-avatar" class="channel-avatar"></div>
              <div>
                <p id="channel-name" class="channel-name"></p>
                <p id="channel-subs" class="channel-subs"></p>
              </div>
            </a>
            <details class="description-wrap">
              <summary class="description-toggle">Description</summary>
              <p id="video-description" class="video-description"></p>
            </details>
            <a id="watch-on-yt" href="#" target="_blank" rel="noopener noreferrer" class="yt-link">
              Watch on YouTube ↗
            </a>
          </div>
        </div>
        <aside class="watch-sidebar">
          <h3 class="sidebar-title">Related</h3>
          <div id="related-list" class="related-list"></div>
          <div id="related-loading" class="loading-state small">
            <div class="spinner small"></div>
          </div>
        </aside>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>Viewtube uses <a href="https://invidious.io" target="_blank" rel="noopener">Invidious</a> public instances to access YouTube content. All videos © their respective owners. Not affiliated with YouTube or Google.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
